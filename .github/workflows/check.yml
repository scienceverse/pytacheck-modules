# Store CI: check pull requests; on main, rebuild index.json and commit it.
#
# Runs on GitHub-hosted runners (ubuntu-latest). PR runs are for branches of
# THIS repository only: fork PRs are refused by the check job's `if`, because
# checking a pack runs its code and tests, and that must not happen before a
# maintainer has read it. A pack sent from a fork gets no CI run here: check it
# locally, or push it to a branch of this repository. No secret is passed to
# the pack's code: the one secret, the token for pytacheck's repository, reaches
# git only through the environment of the one step per job that fetches
# pytacheck.
#
# A hosted runner is new for every job, so nothing carries over between runs.
# uv's tools and pytacheck's cache and data live in the job's RUNNER_TEMP.
name: store

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push supersedes an in-flight PR run; runs on main
# queue instead, since the index job pushes to main.
concurrency:
  group: store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # pytacheck is not on PyPI yet, so CI installs its main branch (README.md and
  # CONTRIBUTING.md name the same). Switch to "pytacheck" once it is released.
  # Its canonical URL, not the redirect from thesanogoeffect/pytacheck: that
  # stops the day a repository of that name exists again (a fork, say).
  PYTACHECK_SPEC: "pytacheck @ git+https://github.com/scienceverse/pytacheck@main"
  PYTACHECK_CONFIG: none # ignore any user config: CI sees only the store
  # While pytacheck's repository is private, CI needs a token that can read it:
  # a fine-grained PAT with resource owner scienceverse and "Contents: read" on
  # scienceverse/pytacheck only, saved as this repository's secret
  # PYTACHECK_READ_TOKEN. Only a member of scienceverse can make one (such PATs
  # do not work for outside collaborators); if the organization requires
  # approval, it reads no private repository until an owner approves it; and it
  # expires, so renew the secret before then. Not needed once pytacheck is public.
  # Only the "Install pytacheck" steps see it: they hand it to git as an HTTP
  # header scoped to exactly that repository, through GIT_CONFIG_* variables in
  # the step's own environment. Not as a url.insteadOf rewrite: git passes the
  # rewritten URL, token included, on the command line of git-remote-https,
  # where every user on the host can read it, and an insteadOf prefix is a
  # plain string prefix, so it would also match other scienceverse/pytacheck*
  # repositories, this one (scienceverse/pytacheck-modules) included.

jobs:
  check:
    # Pull requests from branches of this repository only (see the header).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0 # store build needs each pack's last commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          # No uv cache: the store has no lock or requirements file to key it
          # on, so a hosted runner's default cache would warn on every run and
          # keep one entry that never changes.
          enable-cache: false
          # Tools in the job's temp dir: the pack tests below run the pytest
          # installed next to pytacheck, at $UV_TOOL_DIR.
          tool-dir: ${{ runner.temp }}/uv-tools
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin
      - name: Keep pytacheck's state inside this job
        # installed packs and cached store indexes stay out of ~/.cache and
        # ~/.local/share
        run: |
          echo "PYTACHECK_CACHE_DIR=$RUNNER_TEMP/pytacheck-cache" >> "$GITHUB_ENV"
          echo "PYTACHECK_DATA_DIR=$RUNNER_TEMP/pytacheck-data" >> "$GITHUB_ENV"
      - name: Install pytacheck
        # with pytest in the same tool environment, so the packs' tests below
        # run against this very pytacheck and no later step (the ones that run
        # a pack's code) needs the token
        env:
          PYTACHECK_READ_TOKEN: ${{ secrets.PYTACHECK_READ_TOKEN }}
        run: |
          if [ -n "$PYTACHECK_READ_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$PYTACHECK_READ_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/scienceverse/pytacheck.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          fi
          uv tool install --with pytest "$PYTACHECK_SPEC" || {
            if [ -z "$PYTACHECK_READ_TOKEN" ]; then
              echo "::error::installing pytacheck failed, and the PYTACHECK_READ_TOKEN secret is not set: CI needs it while pytacheck's repository is private (see the comment above PYTACHECK_SPEC in this workflow)"
            else
              echo "::error::installing pytacheck failed. If git could not read a username, GitHub refused PYTACHECK_READ_TOKEN: it may have expired, be awaiting approval by a scienceverse owner, or lack Contents: read on scienceverse/pytacheck"
            fi
            exit 1
          }
      - name: Check the store
        run: pytacheck store build . --check --repo "$GITHUB_REPOSITORY"
      - name: Check changed packs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          changed=$(git diff --name-only "$BASE"...HEAD -- packs/ | cut -d/ -f2 | sed 's/\.json$//' | sort -u)
          for name in $changed; do
            if [ -d "packs/$name" ]; then
              echo "::group::pytacheck pack check packs/$name"
              pytacheck pack check "packs/$name" || status=1
              if [ -d "packs/$name/tests" ]; then
                (cd "packs/$name" && "$UV_TOOL_DIR/pytacheck/bin/pytest" -q tests) || status=1
              fi
              echo "::endgroup::"
            elif [ -f "packs/$name.json" ]; then
              # a pack in its author's repository: fetched at its rev, then checked
              echo "::group::pytacheck pack check packs/$name.json"
              pytacheck pack check "packs/$name.json" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  index:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          # same settings as the check job
          enable-cache: false
          tool-dir: ${{ runner.temp }}/uv-tools
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin
      - name: Keep pytacheck's state inside this job
        run: |
          echo "PYTACHECK_CACHE_DIR=$RUNNER_TEMP/pytacheck-cache" >> "$GITHUB_ENV"
          echo "PYTACHECK_DATA_DIR=$RUNNER_TEMP/pytacheck-data" >> "$GITHUB_ENV"
      - name: Install pytacheck
        env:
          PYTACHECK_READ_TOKEN: ${{ secrets.PYTACHECK_READ_TOKEN }}
        run: |
          if [ -n "$PYTACHECK_READ_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$PYTACHECK_READ_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/scienceverse/pytacheck.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          fi
          uv tool install "$PYTACHECK_SPEC" || {
            if [ -z "$PYTACHECK_READ_TOKEN" ]; then
              echo "::error::installing pytacheck failed, and the PYTACHECK_READ_TOKEN secret is not set: CI needs it while pytacheck's repository is private (see the comment above PYTACHECK_SPEC in this workflow)"
            else
              echo "::error::installing pytacheck failed. If git could not read a username, GitHub refused PYTACHECK_READ_TOKEN: it may have expired, be awaiting approval by a scienceverse owner, or lack Contents: read on scienceverse/pytacheck"
            fi
            exit 1
          }
      - name: Build index.json
        run: pytacheck store build . --repo "$GITHUB_REPOSITORY"
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
