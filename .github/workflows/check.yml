# Store CI: check pull requests; on main, rebuild index.json and commit it.
#
# Runs on GitHub-hosted runners (ubuntu-latest). PR runs are for branches of
# THIS repository only: fork PRs are refused by the check job's `if`, because
# checking a pack runs its code and tests, and that must not happen before a
# maintainer has read it. A pack sent from a fork gets no CI run here: check it
# locally, or push it to a branch of this repository. No secret reaches the
# pack's code: the workflow reads no secret except the automatic GITHUB_TOKEN.
#
# A hosted runner is new for every job, so nothing carries over between runs.
# uv's tools and pytacheck's cache and data live in the job's RUNNER_TEMP.
name: store

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push supersedes an in-flight PR run; runs on main
# queue instead, since the index job pushes to main.
concurrency:
  group: store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # pytacheck is not on PyPI yet, so CI installs its main branch (README.md and
  # CONTRIBUTING.md name the same). Switch to "pytacheck" once it is released.
  # Its canonical URL, not the redirect from thesanogoeffect/pytacheck: that
  # stops the day a repository of that name exists again (a fork, say).
  PYTACHECK_SPEC: "pytacheck @ git+https://github.com/scienceverse/pytacheck@main"
  PYTACHECK_CONFIG: none # ignore any user config: CI sees only the store

jobs:
  check:
    # Pull requests from branches of this repository only (see the header).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0 # store build needs each pack's last commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          # No uv cache: the store has no lock or requirements file to key it
          # on, so a hosted runner's default cache would warn on every run and
          # keep one entry that never changes.
          enable-cache: false
          # Tools in the job's temp dir: the pack tests below run the pytest
          # installed next to pytacheck, at $UV_TOOL_DIR.
          tool-dir: ${{ runner.temp }}/uv-tools
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin
      - name: Keep pytacheck's state inside this job
        # installed packs and cached store indexes stay out of ~/.cache and
        # ~/.local/share
        run: |
          echo "PYTACHECK_CACHE_DIR=$RUNNER_TEMP/pytacheck-cache" >> "$GITHUB_ENV"
          echo "PYTACHECK_DATA_DIR=$RUNNER_TEMP/pytacheck-data" >> "$GITHUB_ENV"
      - name: Install pytacheck
        # with pytest in the same tool environment, so the packs' tests below
        # run against this very pytacheck
        run: |
          uv tool install --with pytest "$PYTACHECK_SPEC" || {
            echo "::error::installing pytacheck from $PYTACHECK_SPEC failed"
            exit 1
          }
      - name: Check the store
        run: pytacheck store build . --check --repo "$GITHUB_REPOSITORY"
      - name: Check changed packs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          changed=$(git diff --name-only "$BASE"...HEAD -- packs/ | cut -d/ -f2 | sed 's/\.json$//' | sort -u)
          for name in $changed; do
            if [ -d "packs/$name" ]; then
              echo "::group::pytacheck pack check packs/$name"
              pytacheck pack check "packs/$name" || status=1
              if [ -d "packs/$name/tests" ]; then
                (cd "packs/$name" && "$UV_TOOL_DIR/pytacheck/bin/pytest" -q tests) || status=1
              fi
              echo "::endgroup::"
            elif [ -f "packs/$name.json" ]; then
              # a pack in its author's repository: fetched at its rev, then checked
              echo "::group::pytacheck pack check packs/$name.json"
              pytacheck pack check "packs/$name.json" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  index:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          # same settings as the check job
          enable-cache: false
          tool-dir: ${{ runner.temp }}/uv-tools
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin
      - name: Keep pytacheck's state inside this job
        run: |
          echo "PYTACHECK_CACHE_DIR=$RUNNER_TEMP/pytacheck-cache" >> "$GITHUB_ENV"
          echo "PYTACHECK_DATA_DIR=$RUNNER_TEMP/pytacheck-data" >> "$GITHUB_ENV"
      - name: Install pytacheck
        run: |
          uv tool install "$PYTACHECK_SPEC" || {
            echo "::error::installing pytacheck from $PYTACHECK_SPEC failed"
            exit 1
          }
      - name: Build index.json
        run: pytacheck store build . --repo "$GITHUB_REPOSITORY"
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
