# Store CI: check pull requests; on main, rebuild index.json and commit it.
#
# Runs only on the self-hosted fridge runner registered on this repository
# (label pytacheck-modules-fridge-ci); there is no GitHub-hosted fallback. PR
# runs are for branches of THIS repository only: fork PRs are refused by the
# check job's `if`, because checking a pack runs its code and tests, and that
# must not happen on the runner before a maintainer has read it. A pack sent
# from a fork gets no CI run here: check it locally, or push it to a branch of
# this repository.
#
# The runner keeps its state between jobs (workspace, home directory, caches),
# so nothing here writes the runner user's global config or home: the token for
# pytacheck's repository reaches git only through the environment of the one
# step per job that fetches pytacheck, and uv's tools and pytacheck's cache and
# data live in the job's RUNNER_TEMP, which is emptied before and after every
# job.
name: store

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref on the runner: a newer push supersedes an in-flight PR run;
# runs on main queue instead, since the index job pushes to main.
concurrency:
  group: store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # pytacheck is not on PyPI yet, so CI installs its development branch.
  # Switch to "pytacheck" once it is released.
  PYTACHECK_SPEC: "pytacheck @ git+https://github.com/thesanogoeffect/pytacheck@claude/pytacheck-metacheck-fork-0x7q73"
  PYTACHECK_CONFIG: none # ignore any user config: CI sees only the store
  # While pytacheck's repository is private, CI needs a token that can read it:
  # a fine-grained PAT with "Contents: read" on thesanogoeffect/pytacheck, saved
  # as the repository secret PYTACHECK_READ_TOKEN. Not needed once it is public.
  # Only the "Install pytacheck" steps see it: they hand it to git as an HTTP
  # header scoped to exactly that repository, through GIT_CONFIG_* variables in
  # the step's own environment. Not as a url.insteadOf rewrite: git passes the
  # rewritten URL, token included, on the command line of git-remote-https,
  # where every user on the host can read it, and an insteadOf prefix also
  # matches this repository (thesanogoeffect/pytacheck-modules).

jobs:
  check:
    # Pull requests from branches of this repository only (see the header).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, pytacheck-modules-fridge-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0 # store build needs each pack's last commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          # Tools in the job's temp dir, not ~/.local: that outlives the job and
          # is shared with every other job run by the runner's user.
          tool-dir: ${{ runner.temp }}/uv-tools
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin
      - name: Keep pytacheck's state inside this job
        # installed packs and cached store indexes would otherwise carry over
        # between runs in the runner user's ~/.cache and ~/.local/share
        run: |
          echo "PYTACHECK_CACHE_DIR=$RUNNER_TEMP/pytacheck-cache" >> "$GITHUB_ENV"
          echo "PYTACHECK_DATA_DIR=$RUNNER_TEMP/pytacheck-data" >> "$GITHUB_ENV"
      - name: Install pytacheck
        # with pytest in the same tool environment, so the packs' tests below
        # run against this very pytacheck and no later step (the ones that run
        # a pack's code) needs the token
        env:
          PYTACHECK_READ_TOKEN: ${{ secrets.PYTACHECK_READ_TOKEN }}
        run: |
          if [ -n "$PYTACHECK_READ_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$PYTACHECK_READ_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/thesanogoeffect/pytacheck.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          fi
          uv tool install --with pytest "$PYTACHECK_SPEC"
      - name: Check the store
        run: pytacheck store build . --check --repo "$GITHUB_REPOSITORY"
      - name: Check changed packs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          changed=$(git diff --name-only "$BASE"...HEAD -- packs/ | cut -d/ -f2 | sed 's/\.json$//' | sort -u)
          for name in $changed; do
            if [ -d "packs/$name" ]; then
              echo "::group::pytacheck pack check packs/$name"
              pytacheck pack check "packs/$name" || status=1
              if [ -d "packs/$name/tests" ]; then
                (cd "packs/$name" && "$UV_TOOL_DIR/pytacheck/bin/pytest" -q tests) || status=1
              fi
              echo "::endgroup::"
            elif [ -f "packs/$name.json" ]; then
              # a pack in its author's repository: fetched at its rev, then checked
              echo "::group::pytacheck pack check packs/$name.json"
              pytacheck pack check "packs/$name.json" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  index:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, pytacheck-modules-fridge-ci]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          # see the check job
          tool-dir: ${{ runner.temp }}/uv-tools
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin
      - name: Keep pytacheck's state inside this job
        run: |
          echo "PYTACHECK_CACHE_DIR=$RUNNER_TEMP/pytacheck-cache" >> "$GITHUB_ENV"
          echo "PYTACHECK_DATA_DIR=$RUNNER_TEMP/pytacheck-data" >> "$GITHUB_ENV"
      - name: Install pytacheck
        env:
          PYTACHECK_READ_TOKEN: ${{ secrets.PYTACHECK_READ_TOKEN }}
        run: |
          if [ -n "$PYTACHECK_READ_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$PYTACHECK_READ_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/thesanogoeffect/pytacheck.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          fi
          uv tool install "$PYTACHECK_SPEC"
      - name: Build index.json
        run: pytacheck store build . --repo "$GITHUB_REPOSITORY"
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
